[package]
name = "open-ar-editor"
version = "0.1.0"
description = "미디어아트 작가를 위한 오픈소스 WebAR 에디터"
authors = ["open-ar-editor contributors"]
license = "MIT"
repository = "https://github.com/open-ar-editor/open-ar-editor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "open_ar_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
