[package]
name = "open-ar-editor"
version = "0.1.0"
description = "미디어아트 작가를 위한 오픈소스 WebAR 에디터"
authors = ["open-ar-editor contributors"]
license = "MIT"
repository = "https://github.com/open-ar-editor/open-ar-editor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "open_ar_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri 코어 ──────────────────────────────────────────────────────────────
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# ── 직렬화 ──────────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 비동기 런타임 ────────────────────────────────────────────────────────────
# Tauri 2 는 내부적으로 tokio 를 사용하므로 함께 포함.
tokio = { version = "1", features = ["full"] }

# ── 날짜/시간 ────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── 해시 ────────────────────────────────────────────────────────────────────
sha2 = "0.10"
hex = "0.4"

# ── ID 생성 (nanoid 스타일 16자) ─────────────────────────────────────────────
nanoid = "0.4"

# ── QR 코드 ─────────────────────────────────────────────────────────────────
qrcode = "0.14"

# ── Base64 ──────────────────────────────────────────────────────────────────
base64 = "0.22"

# ── 이미지 (QR PNG 인코딩) ───────────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = ["png"] }

# ── LAN IP 감지 ─────────────────────────────────────────────────────────────
local-ip-address = "0.6"

# ── HTTP 서버 (preview server) ───────────────────────────────────────────────
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
